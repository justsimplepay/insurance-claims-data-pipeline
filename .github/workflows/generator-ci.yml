name: Generator CI

on:
  push:
    paths:
      - "generator/**"
      - "pipeline/**"
      - "sql/**"
      - "generate_data.py"
      - "requirements.txt"
      - ".github/workflows/generator-ci.yml"
  pull_request:
    paths:
      - "generator/**"
      - "pipeline/**"
      - "sql/**"
      - "generate_data.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  generator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claims_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d claims_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/claims_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest generator.test_generator -v
      - run: python -m unittest discover -s pipeline -p 'test_*.py' -v
      - run: python -m py_compile pipeline/*.py
      - run: python generate_data.py
      - name: Run clean database bootstrap and end-to-end pipeline
        run: python pipeline/run_pipeline.py --batch-name ci-${{ github.sha }} --output-dir output/ci
      - name: Freeze validated source inputs in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/Customer.csv data/raw/Policy.csv data/raw/Claim.csv data/raw/Claim_Payment.csv data/raw/Policy_Premium.csv
          git add data/raw/json
          if ! git diff --cached --quiet; then
            git commit -m "Freeze validated synthetic source dataset [skip ci]"
            git push
          fi
      - name: Package frozen reference dataset
        run: tar -czf reference-dataset.tar.gz data/raw
      - name: Upload frozen reference dataset
        uses: actions/upload-artifact@v4
        with:
          name: insurance-claims-reference-${{ github.sha }}
          path: reference-dataset.tar.gz
          if-no-files-found: error
          retention-days: 90
