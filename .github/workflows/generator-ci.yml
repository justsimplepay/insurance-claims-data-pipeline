name: Generator CI

on:
  push:
    paths:
      - "generator/**"
      - "generate_data.py"
      - "requirements.txt"
      - ".github/workflows/generator-ci.yml"
  pull_request:
    paths:
      - "generator/**"
      - "generate_data.py"
      - "requirements.txt"

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest generator.test_generator -v
      - run: python generate_data.py
      - name: Package frozen reference dataset
        run: tar -czf reference-dataset.tar.gz data/raw
      - name: Upload frozen reference dataset
        uses: actions/upload-artifact@v4
        with:
          name: insurance-claims-reference-${{ github.sha }}
          path: reference-dataset.tar.gz
          if-no-files-found: error
          retention-days: 90
